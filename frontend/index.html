<!doctype html>
<html lang="hr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Predložak web3 aplikacije za zajednicu." />
    <title>TBD</title>
    <script>
      // Tema se postavlja prije renderiranja da nema bljeska pogresne boje
      ;(() => {
        const saved = localStorage.getItem('tbd-theme')
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const mode = saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light'
        document.documentElement.dataset.theme = mode
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
